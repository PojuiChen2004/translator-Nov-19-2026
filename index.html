<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="雙向翻譯">
<meta name="theme-color" content="#000000">
<title>中英雙向即時翻譯</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;overscroll-behavior:none;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","PingFang TC","Helvetica Neue",sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.slot{flex:1;min-height:0;display:flex;overflow:hidden}
.panel{flex:1;min-width:0;display:flex;flex-direction:column;padding:10px 16px 8px}
.panel.zh{background:#1d4ed8}
.panel.en{background:#dc2626}
.panel.flip{transform:rotate(180deg)}
.head{display:flex;justify-content:space-between;align-items:center;height:28px;flex:none;font-size:14px;font-weight:600;opacity:.95}
.pill{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.22);display:none}
.pill.on{display:inline-block}
.pill.listen::before{content:"● ";animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.msgs{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:10px;padding:4px 0}
.msgs::before{content:"";flex:1}
.msg{font-size:24px;line-height:1.35;font-weight:500;opacity:.6;word-break:break-word;-webkit-user-select:text;user-select:text}
.msg.cur{opacity:1;font-size:30px;font-weight:600}
.msg.interim{opacity:.8;font-style:italic;font-size:26px}
.msg.err{opacity:.9;font-size:16px}
.hint{opacity:.7;font-size:18px;align-self:center;margin:auto;text-align:center}
#bar{flex:none;display:flex;gap:6px;padding:8px 10px;background:#0b0b0f;align-items:stretch}
.seg{display:flex;gap:6px;flex:2}
.btn{flex:1;min-height:54px;border:0;border-radius:14px;background:#2a2a33;color:#fff;font-size:20px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 2px;font-family:inherit}
.btn small{font-size:11px;opacity:.9;font-weight:600}
.btn:active{filter:brightness(1.3)}
.btn.lang.sel.zh{background:#1d4ed8}
.btn.lang.sel.en{background:#dc2626}
.btn.mic{flex:1.3;background:#e5e7eb;color:#111}
.btn.mic.on{background:#16a34a;color:#fff}
.btn.off{opacity:.5}
#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);max-width:86%;background:rgba(0,0,0,.88);color:#fff;
  padding:12px 16px;border-radius:12px;font-size:15px;line-height:1.4;z-index:20;display:none;text-align:center;border:1px solid #444}
#hist{position:fixed;inset:0;background:#0b0b0f;z-index:30;display:none;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#hist.show{display:flex}
.hh{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;gap:8px}
.hh h2{margin:0;font-size:18px}
.hh .btn{flex:none;min-height:40px;padding:0 14px;font-size:15px;flex-direction:row}
#hlist{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 12px 16px;display:flex;flex-direction:column;gap:14px}
.item .time{font-size:12px;opacity:.6;margin:0 2px 4px}
.item .blk{padding:10px 12px;font-size:17px;line-height:1.4;-webkit-user-select:text;user-select:text}
.item .blk.zh{background:#1d4ed8;border-radius:12px 12px 0 0}
.item .blk.en{background:#dc2626;border-radius:0 0 12px 12px}
.item .blk.zh:only-of-type,.item .blk.en:only-of-type{border-radius:12px}
.item .blk b{font-size:11px;opacity:.75;display:block;margin-bottom:2px}
.empty{opacity:.6;text-align:center;margin-top:60px}
</style>
</head>
<body>
<div id="app">
  <div class="slot" id="slotTop"></div>
  <div id="bar">
    <div class="seg">
      <button class="btn lang zh" id="bZh">🎧<small>聽中文</small></button>
      <button class="btn lang en" id="bEn">🎧<small>Listen EN</small></button>
    </div>
    <button class="btn mic" id="bMic">🎤<small>開始</small></button>
    <button class="btn" id="bSwap">⇅<small>換位</small></button>
    <button class="btn" id="bTts">🔊<small>朗讀</small></button>
    <button class="btn" id="bHist">🕘<small>歷史</small></button>
  </div>
  <div class="slot" id="slotBot"></div>
</div>
<div id="toast"></div>
<div id="hist">
  <div class="hh">
    <button class="btn" id="hBack">← 返回</button>
    <h2>歷史紀錄 History</h2>
    <button class="btn" id="hClear">清除</button>
  </div>
  <div id="hlist"></div>
</div>

<script>
(function(){
'use strict';
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var LANG = {
  zh:{rec:'zh-CN', tts:'zh-CN', tr:'zh-CN', name:'中文（简体）'},
  en:{rec:'en-US', tts:'en-US', tr:'en',    name:'English'}
};
var PILL = {
  zh:{listen:'聆聽中', trans:'翻譯中', speak:'朗讀中'},
  en:{listen:'Listening', trans:'Translating', speak:'Speaking'}
};
var HINT = {zh:'按「開始」後說話', en:'Tap Start and speak'};

var state = {listen:'zh', topLang:'en', tts:true, active:false, busy:false, phase:'idle', curTo:'en', turns:[]};
var rec = null, finalText = '', interimText = '', lastErr = '', wake = null;
var hist = [];

function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function other(l){return l==='zh'?'en':'zh';}

/* ---------- 儲存 ---------- */
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
(function load(){
  try{
    var s = JSON.parse(lsGet('bt_set')||'{}');
    if(s.topLang==='zh'||s.topLang==='en') state.topLang = s.topLang;
    if(s.listen==='zh'||s.listen==='en') state.listen = s.listen;
    if(typeof s.tts==='boolean') state.tts = s.tts;
    var h = JSON.parse(lsGet('bt_hist')||'[]');
    if(Array.isArray(h)) hist = h;
  }catch(e){}
})();
function saveSet(){lsSet('bt_set', JSON.stringify({topLang:state.topLang, listen:state.listen, tts:state.tts}));}
function saveHist(){ if(hist.length>300) hist = hist.slice(-300); lsSet('bt_hist', JSON.stringify(hist)); }

/* ---------- 介面 ---------- */
var panels = {};
['zh','en'].forEach(function(l){
  var p = document.createElement('section');
  p.className = 'panel '+l;
  p.innerHTML = '<div class="head"><span>'+esc(LANG[l].name)+'</span><span class="pill"></span></div><div class="msgs"></div>';
  panels[l] = p;
});

function layout(){
  var top = state.topLang, bot = other(top);
  $('slotTop').appendChild(panels[top]);
  $('slotBot').appendChild(panels[bot]);
  panels[top].classList.add('flip');
  panels[bot].classList.remove('flip');
}

function render(){
  ['zh','en'].forEach(function(l){
    var box = panels[l].querySelector('.msgs');
    var h = '';
    var turns = state.turns.slice(-30);
    turns.forEach(function(t,i){
      var txt = t[l];
      var cls = 'msg' + (i===turns.length-1 ? ' cur' : '') + (t.err && l!==t.from ? ' err' : '');
      if(txt) h += '<div class="'+cls+'">'+esc(txt)+'</div>';
      else if(t.pending) h += '<div class="'+cls+'">…</div>';
    });
    if(state.phase==='listen' && l===state.listen){
      var live = (finalText+interimText).trim();
      if(live) h += '<div class="msg interim">'+esc(live)+'</div>';
    }
    if(!h) h = '<div class="hint">'+esc(HINT[l])+'</div>';
    box.innerHTML = h;
    box.scrollTop = box.scrollHeight;

    var pill = panels[l].querySelector('.pill');
    var show = false, key = '';
    if(state.phase==='listen' && l===state.listen){show=true; key='listen';}
    else if((state.phase==='trans'||state.phase==='speak') && l===state.curTo){show=true; key=state.phase;}
    pill.className = 'pill' + (show ? ' on '+key : '');
    pill.textContent = show ? PILL[l][key] : '';
  });
  $('bZh').className = 'btn lang zh' + (state.listen==='zh' ? ' sel' : '');
  $('bEn').className = 'btn lang en' + (state.listen==='en' ? ' sel' : '');
  var mic = $('bMic');
  mic.className = 'btn mic' + (state.active ? ' on' : '');
  mic.innerHTML = (state.active ? '⏹' : '🎤') + '<small>' + (state.active ? '停止 Stop' : '開始 Start') + '</small>';
  var tb = $('bTts');
  tb.className = 'btn' + (state.tts ? '' : ' off');
  tb.innerHTML = (state.tts ? '🔊' : '🔇') + '<small>' + (state.tts ? '朗讀 On' : '靜音 Off') + '</small>';
}

var toastTm = null;
function toast(msg, ms){
  var t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTm); toastTm = setTimeout(function(){t.style.display='none';}, ms||4000);
}

function setPhase(p){ state.phase = p; render(); }

/* ---------- 翻譯 ---------- */
function chunk(text){
  var parts = text.split(/(?<=[。！？!?.；;])/);
  var out = [], cur = '';
  parts.forEach(function(p){
    if((cur+p).length > 400 && cur){ out.push(cur); cur = p; } else cur += p;
  });
  if(cur) out.push(cur);
  return out.length ? out : [text];
}
function decodeHtml(s){ var d = document.createElement('textarea'); d.innerHTML = s; return d.value; }

async function translateOne(text, from, to){
  var pair = LANG[from].tr + '|' + LANG[to].tr;
  var url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=' + encodeURIComponent(pair);
  var ctl = new AbortController();
  var tm = setTimeout(function(){ctl.abort();}, 12000);
  try{
    var r = await fetch(url, {signal:ctl.signal});
    var j = await r.json();
    var st = Number(j.responseStatus);
    var t = j.responseData && j.responseData.translatedText;
    if(st !== 200 || !t) throw new Error('translate '+st);
    return decodeHtml(t);
  } finally { clearTimeout(tm); }
}
async function translate(text, from, to){
  var parts = chunk(text), out = [];
  for(var i=0;i<parts.length;i++){ out.push(await translateOne(parts[i], from, to)); }
  return out.join(to==='zh' ? '' : ' ');
}

/* ---------- 朗讀 ---------- */
function speak(text, l){
  return new Promise(function(res){
    var tm = null, done = false;
    function fin(){ if(done) return; done = true; clearTimeout(tm); setTimeout(res, 400); }
    try{
      var u = new SpeechSynthesisUtterance(text);
      u.lang = LANG[l].tts; u.rate = 1;
      u.onend = fin; u.onerror = fin;
      tm = setTimeout(fin, 4000 + text.length*300);
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    }catch(e){ fin(); }
  });
}

/* ---------- 語音辨識 ---------- */
function stopRec(){
  if(rec){ var r = rec; rec = null; try{ r.onresult=r.onend=r.onerror=r.onstart=null; r.abort(); }catch(e){} }
}

function startRec(){
  if(!state.active || state.busy) return;
  stopRec();
  finalText = ''; interimText = ''; lastErr = '';
  var r = new SR();
  rec = r;
  r.lang = LANG[state.listen].rec;
  r.continuous = false;       // 停頓＝一句話結束
  r.interimResults = true;
  r.maxAlternatives = 1;
  r.onstart = function(){ if(rec===r) setPhase('listen'); };
  r.onresult = function(e){
    if(rec!==r) return;
    var f = '', i = '';
    for(var k=0;k<e.results.length;k++){
      var res = e.results[k];
      if(res.isFinal) f += res[0].transcript; else i += res[0].transcript;
    }
    finalText = f; interimText = i; render();
  };
  r.onerror = function(e){
    if(rec!==r) return;
    lastErr = e.error || '';
    if(lastErr==='not-allowed'){
      state.active = false;
      toast('麥克風或語音辨識權限被拒絕。請到「設定 > Safari > 麥克風」允許，並確認 Siri 與聽寫已開啟。', 7000);
    } else if(lastErr==='service-not-allowed'){
      state.active = false;
      toast('請到「設定 > 一般 > 鍵盤」開啟「啟用聽寫」，並開啟 Siri。', 7000);
    } else if(lastErr==='network'){
      state.active = false;
      toast('語音辨識需要網路連線。', 5000);
    }
  };
  r.onend = function(){
    if(rec!==r) return;
    rec = null;
    var text = (finalText+interimText).trim();
    finalText = ''; interimText = '';
    if(!state.active){ setPhase('idle'); return; }
    if(text.length > 0){ handle(text); }
    else { setTimeout(startRec, 300); }
  };
  try{ r.start(); }catch(e){ rec = null; setTimeout(startRec, 500); }
}

async function handle(text){
  // 句子結束：暫停收音 → 翻譯 → 顯示 → 朗讀 → 結束後才重新收音
  state.busy = true;
  var from = state.listen, to = other(from);
  state.curTo = to;
  var turn = {t:Date.now(), from:from, zh:'', en:'', pending:true, err:false};
  turn[from] = text;
  state.turns.push(turn);
  setPhase('trans');

  var out = null;
  try{ out = await translate(text, from, to); }catch(e){ out = null; }
  turn.pending = false;
  if(out){
    turn[to] = out;
    hist.push({t:turn.t, from:from, zh:turn.zh, en:turn.en});
    saveHist();
  } else {
    turn.err = true;
    turn[to] = '（翻譯失敗，請檢查網路 / Translation failed）';
  }
  render();

  if(out && state.tts && state.active){
    setPhase('speak');
    await speak(out, to);
  }
  state.busy = false;
  if(state.active){ setPhase('listen'); startRec(); } else setPhase('idle');
}

async function lockScreen(){
  try{ if(navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); }catch(e){}
}
function unlockScreen(){ try{ if(wake){ wake.release(); wake = null; } }catch(e){} }

function startAll(){
  if(!SR){ toast('此瀏覽器不支援語音辨識。請用 iPhone 的 Safari 開啟。', 6000); return; }
  state.active = true;
  // iOS 需要在點擊當下「解鎖」語音朗讀
  try{ var u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); }catch(e){}
  lockScreen();
  render();
  if(!state.busy) startRec();
}
function stopAll(){
  state.active = false;
  stopRec();
  try{ speechSynthesis.cancel(); }catch(e){}
  unlockScreen();
  if(!state.busy) setPhase('idle'); else render();
}

/* ---------- 歷史紀錄 ---------- */
var hSpeakTm = null;
function renderHist(){
  var box = $('hlist');
  if(!hist.length){ box.innerHTML = '<div class="empty">還沒有紀錄<br>No history yet</div>'; return; }
  var h = '';
  for(var i=hist.length-1;i>=0;i--){
    var e = hist[i];
    var d = new Date(e.t).toLocaleString('zh-TW',{hour12:false,month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
    h += '<div class="item"><div class="time">'+esc(d)+'（點文字可朗讀 / tap to hear）</div>'
      + '<div class="blk zh" data-l="zh" data-i="'+i+'"><b>中文</b>'+esc(e.zh)+'</div>'
      + '<div class="blk en" data-l="en" data-i="'+i+'"><b>English</b>'+esc(e.en)+'</div></div>';
  }
  box.innerHTML = h;
}
$('hlist').addEventListener('click', function(ev){
  var el = ev.target.closest('.blk'); if(!el) return;
  if(window.getSelection && String(window.getSelection())) return;
  var e = hist[Number(el.getAttribute('data-i'))]; if(!e) return;
  var l = el.getAttribute('data-l');
  speak(e[l], l);
});
var clearArmed = false, clearTm = null;
$('hClear').addEventListener('click', function(){
  var b = $('hClear');
  if(!clearArmed){ clearArmed = true; b.textContent = '再按一次確認'; clearTm = setTimeout(function(){clearArmed=false; b.textContent='清除';}, 3000); return; }
  clearTimeout(clearTm); clearArmed = false; b.textContent = '清除';
  hist = []; saveHist(); renderHist();
});
$('bHist').addEventListener('click', function(){ renderHist(); $('hist').classList.add('show'); });
$('hBack').addEventListener('click', function(){ try{speechSynthesis.cancel();}catch(e){} $('hist').classList.remove('show'); });

/* ---------- 按鈕 ---------- */
$('bMic').addEventListener('click', function(){ state.active ? stopAll() : startAll(); });
function setListen(l){
  if(state.listen===l) return;
  state.listen = l; saveSet(); render();
  if(state.active && !state.busy){ stopRec(); startRec(); }
}
$('bZh').addEventListener('click', function(){ setListen('zh'); });
$('bEn').addEventListener('click', function(){ setListen('en'); });
$('bSwap').addEventListener('click', function(){ state.topLang = other(state.topLang); saveSet(); layout(); render(); });
$('bTts').addEventListener('click', function(){
  state.tts = !state.tts; saveSet();
  if(!state.tts){ try{speechSynthesis.cancel();}catch(e){} }
  render();
});
document.addEventListener('visibilitychange', function(){ if(document.hidden && state.active) stopAll(); });

layout();
render();
if(!SR) toast('此瀏覽器不支援語音辨識。請用 iPhone 的 Safari 開啟。', 8000);
})();
</script>
</body>
</html>
